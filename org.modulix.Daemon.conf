<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <policy user="root">
    <allow own="org.modulix.Daemon" />
    <allow
            send_destination="org.modulix.Daemon"
            send_interface="org.modulix.Daemon"
        />
  </policy>

  <policy context="default">
    <allow
            send_destination="org.modulix.Daemon"
            send_interface="org.freedesktop.DBus.Introspectable"
        />
    <allow
            send_destination="org.modulix.Daemon"
            send_interface="org.freedesktop.DBus.Properties"
        />
    <!-- Store1 (reads) is unprivileged; the bus grants every caller access,
         the interface itself does no further access control. -->
    <allow
            send_destination="org.modulix.Daemon"
            send_interface="org.modulix.Store1"
        />
    <!-- Daemon (writes) is allowed through the bus so a non-root caller
         reaches the polkit check inside the method instead of failing with
         AccessDenied before it: access control for writes is polkit's job,
         not the bus policy's. -->
    <allow
            send_destination="org.modulix.Daemon"
            send_interface="org.modulix.Daemon"
        />
  </policy>
</busconfig>
