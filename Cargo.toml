[package]
name = "modulix-daemon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mx-daemon"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures = "0.3.34"
futures-util = "0.3"
# Install/uninstall (module, package, plugin) and every read (search, listings,
# enrichment) are delegated to core-utils; see src/command and src/store.
modulix-core-utils = { path = "../modulix-core-utils", features = [
    "package-info",
    "app-info-gui",
    "module-info",
    "install-package",
    "install-module",
    "system-update",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_polkit = { version = "5.1.0", default-features = false, features = ["tokio"] }
